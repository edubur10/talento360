# ═══ Talento 360° Salud — Despliegue Local HTTP (Puerto 3002) ═══
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: t360
      POSTGRES_USER: t360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t360 -d t360"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://t360:${POSTGRES_PASSWORD}@db:5432/t360?schema=public
      SEED_MODE: ${SEED_MODE:-produccion}
      SEED_INSTITUTION_NAME: ${SEED_INSTITUTION_NAME:-}
      SEED_INSTITUTION_SLUG: ${SEED_INSTITUTION_SLUG:-}
      SEED_INSTITUTION_CITY: ${SEED_INSTITUTION_CITY:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://t360:${POSTGRES_PASSWORD}@db:5432/t360?schema=public
      APP_URL: ${APP_URL:?Defina APP_URL en .env}
      DEFAULT_INSTITUTION_SLUG: ${DEFAULT_INSTITUTION_SLUG:-pio-xii}
      SESSION_HOURS: ${SESSION_HOURS:-10}
      HOSTNAME: "0.0.0.0"
      ALLOW_INSECURE_COOKIES: "1" # necesario mientras se acceda por HTTP
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3002:3002"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: t360
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: t360
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - /srv/t360/backups:/backups
      - ./deploy/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

configs:
  caddyfile:
    content: |
      {
          admin off
      }

      :3002 {
          encode zstd gzip

          @publico path /c/* /api/public/* /seguimiento*
          log_skip @publico

          log {
              output stdout
              format json
          }

          header {
              -Server
          }

          reverse_proxy app:3000
      }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
